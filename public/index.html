<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b0b0f">
    <meta name="description" content="AI_Lua_roblox - ذكاء اصطناعي متخصص في Roblox Studio وLuau">

    <title>AI_Lua_roblox</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo-box">
                <img src="/logo.png" alt="AI_Lua_roblox">
            </div>

            <div class="brand-info">
                <strong>AI_Lua_roblox</strong>
                <span>Roblox AI Assistant</span>
            </div>

            <button class="close-sidebar" id="closeSidebar">×</button>
        </div>

        <button class="new-chat" id="newChatButton">
            <span>＋</span>
            <b>محادثة جديدة</b>
        </button>

        <div class="history-title">المحادثات</div>

        <div class="conversation-list" id="conversationList"></div>

        <div class="sidebar-footer">

            <button id="settingsButton">
                <span>⚙</span>
                الإعدادات
            </button>

            <button id="helpButton">
                <span>?</span>
                المساعدة
            </button>

        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <button class="mobile-menu" id="openSidebar">
                ☰
            </button>

            <div class="model-area">

                <button class="model-button" id="modelButton">

                    <div class="model-mini-logo">
                        <img src="/logo.png" alt="">
                    </div>

                    <div>
                        <strong id="modelName">
                            AI_Lua_roblox
                        </strong>

                        <small>
                            Roblox & Luau
                        </small>
                    </div>

                    <span>⌄</span>

                </button>

                <div class="model-menu hidden" id="modelMenu">

                    <button class="model-option active"
                            data-model="lua">

                        <b>AI_Lua_roblox</b>
                        <small>متخصص في Roblox وLuau</small>

                    </button>

                    <button class="model-option"
                            data-model="general">

                        <b>General AI</b>
                        <small>مساعد ذكاء اصطناعي عام</small>

                    </button>

                </div>

            </div>

            <div class="top-actions">

                <button id="shareButton">↗</button>

                <button id="moreButton">•••</button>

            </div>

        </header>


        <!-- CHAT -->
        <section class="chat" id="chatContainer">

            <div class="welcome" id="welcomeScreen">

                <div class="hero-logo">
                    <img src="/logo.png" alt="AI_Lua_roblox">
                </div>

                <div class="online">
                    <i></i>
                    AI_Lua_roblox جاهز
                </div>

                <h1>
                    وش تبي <span>نبني</span> اليوم؟
                </h1>

                <p>
                    مساعدك الذكي المتخصص في
                    <b>Roblox Studio وLuau</b>
                </p>

                <div class="quick-grid">

                    <button class="quick-card"
                        data-prompt="ابنِ لي نظام RemoteEvent آمن ومحترف في Roblox Studio مع جميع الملفات ووضح مكان كل ملف.">

                        <span>🛡️</span>
                        <div>
                            <b>حماية قوية</b>
                            <small>أنظمة سيرفر آمنة</small>
                        </div>

                    </button>

                    <button class="quick-card"
                        data-prompt="علمني Luau في Roblox Studio من الصفر إلى مستوى متقدم بطريقة عملية.">

                        <span>📚</span>
                        <div>
                            <b>تعلم Luau</b>
                            <small>من الصفر للاحتراف</small>
                        </div>

                    </button>

                    <button class="quick-card"
                        data-prompt="راجع كود Roblox هذا وابحث عن الأخطاء والمشاكل الأمنية وحسنه بالكامل.">

                        <span>🔎</span>
                        <div>
                            <b>تحليل الكود</b>
                            <small>Debug + Security</small>
                        </div>

                    </button>

                    <button class="quick-card"
                        data-prompt="صمم لي نظام Roblox كامل واحترافي مع ترتيب الملفات والسكريبتات والكود الكامل.">

                        <span>⚡</span>
                        <div>
                            <b>بناء مشروع</b>
                            <small>نظام كامل</small>
                        </div>

                    </button>

                </div>

            </div>


            <div class="messages" id="messages"></div>


            <!-- TYPING -->
            <div class="typing hidden" id="typingContainer">

                <div class="typing-avatar">
                    <img src="/logo.png" alt="">
                </div>

                <div class="typing-body">

                    <b>AI_Lua_roblox</b>

                    <div class="typing-line">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>

        </section>


        <!-- COMPOSER -->
        <footer class="composer-area">

            <div class="composer-wrap">

                <div class="attach-menu hidden"
                     id="attachmentMenu">

                    <button id="uploadCode">
                        📄 رفع ملف
                    </button>

                    <button id="pasteCode">
                        &lt;/&gt; لصق كود
                    </button>

                </div>


                <div class="composer">

                    <button
                        class="attach"
                        id="attachmentButton">
                        ＋
                    </button>

                    <textarea
                        id="messageInput"
                        maxlength="3000"
                        rows="1"
                        placeholder="اكتب رسالتك لـ AI_Lua_roblox..."
                        autocomplete="off"
                        spellcheck="false"></textarea>

                    <button
                        class="send"
                        id="sendButton"
                        disabled>
                        ↑
                    </button>

                </div>


                <div class="composer-bottom">

                    <span>
                        AI يمكن أن يخطئ، تحقق من الكود قبل استخدامه.
                    </span>

                    <span id="characterCounter">
                        0 / 3000
                    </span>

                </div>

            </div>

        </footer>

    </main>

</div>


<!-- SETTINGS -->
<div class="modal hidden" id="settingsModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>الإعدادات</h2>

            <button id="closeSettings">×</button>

        </div>

        <div class="setting">

            <div>
                <b>المظهر</b>
                <small>تغيير مظهر الموقع</small>
            </div>

            <select id="themeSelect">
                <option value="dark">داكن</option>
                <option value="light">فاتح</option>
            </select>

        </div>

    </div>

</div>


<input
    type="file"
    id="fileInput"
    hidden
    accept=".lua,.luau,.txt,.js,.json,.md">


<script src="/app.js"></script>

</body>
</html>
