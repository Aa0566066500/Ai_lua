<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luau Studio AI - تجربة مجانية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- الهيدر العلوي -->
        <header class="app-header">
            <div class="logo-box">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="#00F2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="logo-text">Luau Studio AI</span>
            </div>
            <span class="status-badge">⚡ تجربة مجانية مباشرة</span>
        </header>

        <!-- منطقة المحادثة -->
        <main class="chat-container" id="chatContainer">
            <div class="welcome-card">
                <h2>مرحباً بك في Luau Studio AI 👋</h2>
                <p>يمكنك البدء في تجربة الذكاء الاصطناعي مباشرة بدون الحاجة لإنشاء حساب أو تسجيل دخول.</p>
            </div>
        </main>

        <!-- صندوق إدخال الرسائل -->
        <footer class="input-footer">
            <form id="chatForm" class="chat-form">
                <input type="text" id="userInput" placeholder="اكتب سؤالك أو طلبك هنا..." required autocomplete="off">
                <button type="submit" id="sendBtn" class="send-btn">
                    <span>إرسال</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="send-icon">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
    <script src="ai.js"></script>
</body>
</html>
